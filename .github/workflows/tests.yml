name: Integration Tests

# ═══════════════════════════════════════════════════════════════════════════════
# The Tryorama suite was RETIRED 2026-08-03 and its `test` job deleted with it.
#
# Upstream @holochain/tryorama is unmaintained: an unmaintained banner landed
# Jan 2026 saying support for Holochain 0.7+ "should not be expected", pointing
# at sweettest instead. Rather than port 92 tests to a dead runner, they were
# audited one by one against sweettest: ~69 were already duplicated there, and
# every unique test was ported before anything was deleted.
#
# That audit found three real gaps, all now closed and each with a test that has
# been SEEN to fail (see the negative controls in CLAUDE.md):
#   * the conflict-of-interest guard had no working coverage at all
#   * DNA 2's cross-agent privacy guarantee had none
#   * link_agent_identity's two signature checks had none
#
# ⚠️ `tripwire` is NO LONGER branch-scoped. It was gated to the v0.7.0 branch,
# which would have meant it stopped running the moment that branch merged and
# disappeared — silently removing the only proof that the integrity zomes still
# reject forbidden updates and deletes. With Tryorama gone it is the sole
# immutability signal, so it runs everywhere. It costs ~50 min.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Why paths-ignore, and why a deny-list ─────────────────────────────────────
# This matrix costs ~90 minutes. Until 2026-08-25 it ran on every push and every
# PR regardless of content, so a pull request that changed nothing but prose
# spent an hour and a half rebuilding WASM and booting conductors. Three
# documentation PRs in one afternoon made the point.
#
# It is a DENY-list, not an allow-list, and that is deliberate. `paths:` means
# "run only for these", so anything nobody thought of silently stops being
# tested — the failure is invisible and arrives later. `paths-ignore:` means
# "skip only for these", so a path nobody thought of still runs the full matrix.
# Wrong guesses cost 90 wasted minutes instead of an untested merge.
#
# Only entries verified not to reach any job are listed. The five jobs build
# Rust/WASM, run sweettest conductors, and drive the Svelte UI with Playwright;
# none reads markdown, docs/, Images/ or the root marketing HTML. Checked with
# `grep -rn 'include_str!|include_bytes!' --include=*.rs valichord/` for a .md
# used as test input — there is none.
#
# ⚠️ Re-check before adding an entry. Markdown IS an input elsewhere in the
# repo: demo/synthetic_study/ has a README the CLI demo loads as the study
# brief. That path is covered by demo.yml, not this file, and demo.yml has its
# own `demo/**` filter — so nothing here changes it.
#
# Safe on merge queues too: `main` has no branch protection, so none of these is
# a required status check and a skipped run cannot leave a PR unmergeable.

on:
  push:
    branches: [main, v0.7.0]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Images/**'
      - '*.html'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Images/**'
      - '*.html'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Supply-chain guard: no test-only hooks in shipped bundles ────────────────
  # The immutability tripwire tests (sweettest_integration/tests/
  # immutability_tripwire.rs) need coordinators built with --features test_utils,
  # which expose `test_force_update_*` externs that can issue an Update against a
  # committed entry. Those must NEVER reach a production hApp.
  #
  # build-test-dnas.sh keeps them quarantined in target-test/ + workdir-test/
  # (both gitignored), but nothing stops someone packing workdir/ from a stale
  # test-feature build by hand. This job is that backstop.
  #
  # Deliberately dependency-free (grep over committed bundles, no Rust, no
  # Holochain binary) so it fails in seconds rather than after a 90-minute matrix.
  no-test-hooks:
    name: Guard — no test-only hooks in production bundles
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check committed bundles for test_utils externs
        run: |
          chmod +x valichord/check-no-test-hooks.sh
          ./valichord/check-no-test-hooks.sh

  # ── Unit tests — conductor-free, and the fastest real signal in the matrix ───
  #
  # ⚠️ ADDED 2026-08-03. These 30 tests had NO CI coverage: `valichord_shared_types`
  # appeared nowhere in this workflow, so TESTING.md's "all run in CI" was false for
  # them. They run natively in under a second — there was never a cost reason.
  #
  # What they cover is not incidental: `evaluate_badge`, `derive_agreement_level` and
  # `derive_majority_outcome` are the arithmetic every HarmonyRecord's badge tier rests
  # on, and a HarmonyRecord is immutable — a wrong tier is wrong permanently. The
  # 3 governance_coordinator tests cover validator_attestation_pairs, split out of
  # write_harmony_record after the undercount bug (60a5609c) so it could be tested in
  # 0.00s instead of a 7-conductor round.
  unit:
    name: Unit tests (conductor-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('valichord/Cargo.lock') }}

      # Native host build, NOT wasm32 — these are plain Rust unit tests.
      - name: Run unit tests
        working-directory: valichord
        run: |
          cargo test -p valichord_shared_types
          cargo test -p governance_coordinator

  # ── UI E2E: Playwright against a real conductor ──────────────────────────────
  # Fast independent signal (~5–10 min): uses the COMMITTED workdir/valichord.happ
  # (repo convention: always repack + commit after source changes), so no Rust
  # toolchain is needed. One throwaway conductor per run, managed by Playwright
  # globalSetup/globalTeardown (valichord-ui/tests/e2e/setup/conductor-manager.ts).
  ui-e2e:
    name: UI E2E (Playwright + real conductor)
    runs-on: ubuntu-latest
    # ✅ UNSKIPPED 2026-08-02 — this job now runs on v0.7.0 too, and is the only
    # thing that proves the UI half of Phase B. Both reasons it was skipped have
    # gone: @holochain/client 0.21.0 went stable on npm `latest` 2026-08-01 (the
    # UI is on it), and workdir/valichord.happ has been repacked on the 0.7
    # toolchain since Phase A closed. Verified locally against a real 0.7.0
    # conductor before unskipping — 6/6 passed.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── Holochain binary — shared cache with the other jobs ─────────────────
      - name: Cache Holochain binaries
        uses: actions/cache@v4
        id: cache-hc-bin-e2e
        with:
          path: ~/.local/bin/hc-tools
          key: ${{ runner.os }}-hc-bin-0.7.0

      - name: Download Holochain binaries
        if: steps.cache-hc-bin-e2e.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin/hc-tools
          BASE=https://github.com/holochain/holochain/releases/download/holochain-0.7.0
          curl -sSL $BASE/holochain-x86_64-unknown-linux-gnu              -o ~/.local/bin/hc-tools/holochain
          curl -sSL $BASE/hc-x86_64-unknown-linux-gnu                     -o ~/.local/bin/hc-tools/hc
          curl -sSL $BASE/lair-keystore-x86_64-unknown-linux-gnu          -o ~/.local/bin/hc-tools/lair-keystore
          curl -sSL $BASE/kitsune2-bootstrap-srv-x86_64-unknown-linux-gnu -o ~/.local/bin/hc-tools/kitsune2-bootstrap-srv
          chmod +x ~/.local/bin/hc-tools/*

      - name: Add Holochain tools to PATH
        run: echo "$HOME/.local/bin/hc-tools" >> $GITHUB_PATH

      # ── Node / Playwright ────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: valichord-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: valichord-ui
        run: npm ci

      - name: Install Playwright browser
        working-directory: valichord-ui
        run: npx playwright install --with-deps chromium

      # ── Run ──────────────────────────────────────────────────────────────────
      - name: Kill any orphaned Holochain processes
        run: |
          pkill -f holochain     || true
          pkill -f lair-keystore || true
          sleep 2

      - name: Run UI e2e tests
        working-directory: valichord-ui
        run: npx playwright test

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: valichord-ui/test-results/
          retention-days: 7

  # ── Sweettest: one parallel job per test binary ──────────────────────────────
  # Each matrix leg runs a single --test binary so all five run concurrently.
  # Wall-clock is ~the slowest binary (governance ≈170 min) not their serial sum.
  # fail-fast:false lets all legs report even when one fails.
  # Governance gets its own timeout_minutes: 200 (gold badge=34 min, silver=30 min).
  sweettest:
    name: Sweettest (${{ matrix.test }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # No `needs:` — the Tryorama `test` job it used to fail-fast behind was deleted
    # with the suite (2026-08-03). These five legs are now the primary signal.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Counts re-derived from the source 2026-08-03, after the Tryorama port
          # (they had drifted badly). Timeouts carry headroom for the growth:
          # attestation 19→30 tests and governance 17→22.
          - test: attestation           # 30 tests
            timeout_minutes: 180
          - test: governance            # 22 tests (gold=34 min, silver=30 min)
            timeout_minutes: 240
          - test: security              # 12 tests
            timeout_minutes: 150
          - test: researcher_repository # 17 tests
            timeout_minutes: 150
          - test: validator_workspace   # 13 tests
            timeout_minutes: 150
          # ⚠️ ADDED 2026-08-03 — was never in the matrix, so its 5 tests had NO CI
          # signal at all. They are the only coverage anywhere of DNA 3's
          # credentialed membrane: every other suite runs under the dev bypass
          # (`authorized_joining_certificate_issuer: ""`), which skips it entirely.
          - test: membrane_proof        #  5 tests
            timeout_minutes: 150

    steps:
      - uses: actions/checkout@v4

      # Sweettest compiles native holochain (~15 GB target dir). Runners only
      # have ~14 GB free by default, so remove pre-installed tools we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # ── Rust toolchain (same pin as the workspace) ──────────────────────────
      - name: Install Rust (stable + wasm32 target)
        run: rustup toolchain install stable && rustup target add wasm32-unknown-unknown

      # ── System C/C++ deps needed by openssl-sys (sweettest dep tree) ────────
      - name: Install build dependencies
        run: sudo apt-get install -y cmake libssl-dev pkg-config

      # ── Cargo registry cache (covers sweettest's large dep tree) ────────────
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-sweettest-${{ hashFiles('valichord/sweettest_integration/Cargo.lock', 'valichord/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-sweettest-
            ${{ runner.os }}-cargo-registry-

      # ── Cache the sweettest build artifacts ─────────────────────────────────
      # All matrix legs share the same cache key — first save wins, rest are
      # no-ops.  On subsequent runs all legs restore the compiled target dir.
      - name: Cache sweettest build artifacts
        uses: actions/cache@v4
        with:
          path: valichord/sweettest_integration/target
          key: ${{ runner.os }}-sweettest-target-${{ hashFiles('valichord/sweettest_integration/Cargo.lock', 'valichord/sweettest_integration/**/*.rs', 'valichord/**/*.rs', 'valichord/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-sweettest-target-

      # ── Restore packed DNAs from the parent job's WASM cache ────────────────
      - name: Restore WASM build artifacts
        uses: actions/cache@v4
        with:
          path: valichord/target
          key: ${{ runner.os }}-wasm-${{ hashFiles('valichord/**/*.rs', 'valichord/**/Cargo.toml', 'valichord/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      # ── Holochain CLI — shared cache with the test job ───────────────────────
      - name: Cache Holochain binaries
        uses: actions/cache@v4
        id: cache-hc-bin-sweettest
        with:
          path: ~/.local/bin/hc-tools
          key: ${{ runner.os }}-hc-bin-0.7.0

      - name: Download Holochain binaries
        if: steps.cache-hc-bin-sweettest.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin/hc-tools
          BASE=https://github.com/holochain/holochain/releases/download/holochain-0.7.0
          curl -sSL $BASE/holochain-x86_64-unknown-linux-gnu              -o ~/.local/bin/hc-tools/holochain
          curl -sSL $BASE/hc-x86_64-unknown-linux-gnu                     -o ~/.local/bin/hc-tools/hc
          curl -sSL $BASE/lair-keystore-x86_64-unknown-linux-gnu          -o ~/.local/bin/hc-tools/lair-keystore
          curl -sSL $BASE/kitsune2-bootstrap-srv-x86_64-unknown-linux-gnu -o ~/.local/bin/hc-tools/kitsune2-bootstrap-srv
          chmod +x ~/.local/bin/hc-tools/*

      - name: Add Holochain tools to PATH
        run: echo "$HOME/.local/bin/hc-tools" >> $GITHUB_PATH

      # ── Build WASMs and pack DNAs ────────────────────────────────────────────
      - name: Build WASM zomes and pack DNAs
        working-directory: valichord
        run: |
          cargo build --target wasm32-unknown-unknown --release
          hc dna pack dnas/attestation            -o workdir/attestation.dna
          hc dna pack dnas/researcher_repository  -o workdir/researcher_repository.dna
          hc dna pack dnas/validator_workspace    -o workdir/validator_workspace.dna
          hc dna pack dnas/governance             -o workdir/governance.dna
          hc app pack .                           -o workdir/valichord.happ

      # ── Kill any stray conductors, then run this binary's tests ─────────────
      - name: Kill any orphaned Holochain processes
        run: |
          pkill -f holochain     || true
          pkill -f lair-keystore || true
          sleep 2

      - name: Run Sweettest (${{ matrix.test }})
        working-directory: valichord/sweettest_integration
        run: cargo test --test ${{ matrix.test }} -- --test-threads=1

  # ── Immutability tripwires — the only proof the integrity guards hold ────────
  #
  # The 51-arm FlatOp port can silently disable immutability: Rust match ORDERING
  # is the enforcement mechanism, so an arm reflowed behind the generic update arm
  # compiles clean, passes every other test, and lets a forbidden update through.
  # That is not hypothetical — it was reproduced by negative control on 2026-07-30
  # (the forbidden update returned a real ActionHash) and these tests caught it.
  #
  # They are deliberately NOT part of the sweettest matrix: they need a different
  # build (`--features test_utils` -> target-test/, packed to workdir-test/), because
  # no production coordinator exposes update_entry. See build-test-dnas.sh.
  #
  # ⚠️ Runs on ALL branches since 2026-08-03. It was v0.7.0-only, which would have
  # silently switched it off at merge — and with Tryorama retired it is the ONLY
  # test anywhere proving the integrity zomes reject forbidden updates and deletes.
  # 15 tests, ~50 min. Proven able to fail: two negative controls, 2026-07-30 and
  # 2026-08-03, both made a forbidden write SUCCEED and both were caught here.
  tripwire:
    name: Immutability tripwires (integrity zomes)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Two WASM target dirs (target/ + target-test/) plus a native holochain
      # build — same disk pressure as the sweettest legs.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install Rust (stable + wasm32 target)
        run: rustup toolchain install stable && rustup target add wasm32-unknown-unknown

      - name: Install build dependencies
        run: sudo apt-get install -y cmake libssl-dev pkg-config

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-sweettest-${{ hashFiles('valichord/sweettest_integration/Cargo.lock', 'valichord/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-sweettest-
            ${{ runner.os }}-cargo-registry-

      # Shares the sweettest target cache — the native holochain compile is the
      # expensive part and is identical for both.
      - name: Cache sweettest build artifacts
        uses: actions/cache@v4
        with:
          path: valichord/sweettest_integration/target
          key: ${{ runner.os }}-sweettest-target-${{ hashFiles('valichord/sweettest_integration/Cargo.lock', 'valichord/sweettest_integration/**/*.rs', 'valichord/**/*.rs', 'valichord/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-sweettest-target-

      - name: Cache Holochain binaries
        uses: actions/cache@v4
        id: cache-hc-bin-tripwire
        with:
          path: ~/.local/bin/hc-tools
          key: ${{ runner.os }}-hc-bin-0.7.0

      - name: Download Holochain binaries
        if: steps.cache-hc-bin-tripwire.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin/hc-tools
          BASE=https://github.com/holochain/holochain/releases/download/holochain-0.7.0
          curl -sSL $BASE/holochain-x86_64-unknown-linux-gnu              -o ~/.local/bin/hc-tools/holochain
          curl -sSL $BASE/hc-x86_64-unknown-linux-gnu                     -o ~/.local/bin/hc-tools/hc
          curl -sSL $BASE/lair-keystore-x86_64-unknown-linux-gnu          -o ~/.local/bin/hc-tools/lair-keystore
          curl -sSL $BASE/kitsune2-bootstrap-srv-x86_64-unknown-linux-gnu -o ~/.local/bin/hc-tools/kitsune2-bootstrap-srv
          chmod +x ~/.local/bin/hc-tools/*

      - name: Add Holochain tools to PATH
        run: echo "$HOME/.local/bin/hc-tools" >> $GITHUB_PATH

      # Builds production WASM -> target/ AND test-feature coordinators ->
      # target-test/, then packs to workdir-test/. Never touches workdir/.
      - name: Build and pack test DNAs
        working-directory: valichord
        run: |
          chmod +x build-test-dnas.sh
          ./build-test-dnas.sh

      # Belt and braces: the quarantine must hold even here, where the hooks are
      # deliberately built. workdir/ is the committed production bundle set and
      # must stay clean regardless of what build-test-dnas.sh just did.
      - name: Re-assert quarantine (workdir/ must stay hook-free)
        working-directory: valichord
        run: |
          chmod +x check-no-test-hooks.sh
          ./check-no-test-hooks.sh
          if ! git diff --quiet -- workdir/; then
            echo "::error::build-test-dnas.sh modified the committed workdir/ bundles"
            git diff --stat -- workdir/
            exit 1
          fi

      - name: Kill any orphaned Holochain processes
        run: |
          pkill -f holochain     || true
          pkill -f lair-keystore || true
          sleep 2

      - name: Run immutability tripwires
        working-directory: valichord/sweettest_integration
        env:
          VALICHORD_DNA_DIR: ../workdir-test
        run: cargo test --test immutability_tripwire -- --test-threads=1
