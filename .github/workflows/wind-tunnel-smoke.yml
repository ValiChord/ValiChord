name: Wind-Tunnel build + unit tests

# Deterministic CI signal for the wind-tunnel scenarios: compile every scenario
# (against the native holochain stack) and run the pure-logic unit tests.
#
# Why not a live run? A live multi-conductor run was tried in CI twice and both
# failed for environment (not code) reasons on a standard 2-core/7GB GitHub
# runner: (1) the per-agent conductors couldn't peer (the wind-tunnel Holochain
# runner uses the default public bootstrap with no local-bootstrap knob —
# still true as of runner 0.7.1), and (2) the runner couldn't bring up three
# 4-DNA conductors before a startup timeout cancelled setup.
# The live run works on a well-resourced machine
# (median ~185ms cross-agent propagation) — see valichord/wind-tunnel/README.md —
# so it stays local. CI gates on what's reliable: it builds and unit-tests.
#
# Path-filtered, but the filter must cover everything this workspace COMPILES,
# not just the directory it lives in. It is a separate Cargo workspace that pulls
# three crates in by path and inherits the hdk/hdi pins from valichord/Cargo.toml.
#
# This bit us once: RoleSettings::Provisioned gained an `init_properties` field in
# holochain_types 0.6.2, so valichord_wt_common stopped compiling the moment the
# toolchain pins moved on 2026-07-06 — and nothing rebuilt this workspace for
# three weeks, because the pin bump touched valichord/Cargo.toml and the filter
# only watched valichord/wind-tunnel/**. Fixed 2026-07-27 (commit 41cb5a4).
#
# If you add a path dependency to any scenario Cargo.toml, add it here too.
#
# The weekly schedule is the backstop the path filter cannot be: it catches drift
# a diff can't show, e.g. a caret dependency resolving to a newer crates.io
# release. Also manually dispatchable.
on:
  # NOTE: the two path lists below are duplicated on purpose — GitHub Actions does
  # not support YAML anchors/aliases. Keep them in sync by hand.
  push:
    branches: [main]
    paths:
      - 'valichord/wind-tunnel/**'
      - '.github/workflows/wind-tunnel-smoke.yml'
      # Toolchain pins (hdk/hdi/holochain) inherited by the path-dep crates below
      - 'valichord/Cargo.toml'
      - 'valichord/Cargo.lock'
      # Crates compiled by path from scenarios/*/Cargo.toml
      - 'valichord/shared_types/**'
      - 'valichord/dnas/attestation/zomes/attestation_integrity/**'
      - 'valichord/dnas/attestation/zomes/attestation_coordinator/**'
  pull_request:
    branches: [main]
    paths:
      - 'valichord/wind-tunnel/**'
      - '.github/workflows/wind-tunnel-smoke.yml'
      - 'valichord/Cargo.toml'
      - 'valichord/Cargo.lock'
      - 'valichord/shared_types/**'
      - 'valichord/dnas/attestation/zomes/attestation_integrity/**'
      - 'valichord/dnas/attestation/zomes/attestation_coordinator/**'
  schedule:
    # Mondays 06:17 UTC — off the hour to avoid the scheduler's peak-load drop-outs
    - cron: '17 6 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: build all scenarios + unit tests
    runs-on: ubuntu-latest
    # ✅ RE-ENABLED 2026-08-03, same day it was disabled. It was `if: false` for a
    # few hours after the 0.7 merge because this workspace could not build: the
    # scenarios depend on valichord_shared_types BY PATH (hdi 0.8.0 -> holo_hash 0.8)
    # while the crates.io runner pinned holochain 0.6 -> holo_hash 0.6, putting two
    # holo_hash versions in one graph.
    #
    # Fixed by pinning the runner to a git REV of holochain/wind-tunnel (e4861457 =
    # their "Update to Holochain 0.7.0" commit) rather than the crates.io release,
    # which is still a Holochain 0.6 runner despite its 0.7.x version number.
    # Verified locally with exactly the two commands below: build clean in 3m40s,
    # dht_sync_lag 4 passed / 0 failed.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('valichord/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # Native wind-tunnel build (full native holochain) is the long pole on a
      # cold cache; cache it keyed on the wind-tunnel lockfile.
      - name: Cache wind-tunnel build
        uses: actions/cache@v4
        with:
          path: valichord/wind-tunnel/target
          key: ${{ runner.os }}-wt-${{ hashFiles('valichord/wind-tunnel/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wt-

      # Compiles all five scenarios + the shared valichord_wt_common crate against
      # the native conductor stack — catches API / dependency / install-path
      # regressions (e.g. the runner 0.7 bump, the pkcs8/ed25519 pins).
      - name: Build all scenarios
        working-directory: valichord/wind-tunnel
        run: cargo build

      # Pure-logic unit tests (no conductor): unique_data_hash collision-freedom
      # + the propagation-lag math incl. the saturating-skew guard.
      - name: Unit tests (dht_sync_lag)
        working-directory: valichord/wind-tunnel
        run: cargo test -p dht_sync_lag
