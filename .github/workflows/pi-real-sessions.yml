# Run the PiSessionAdapter over REAL pi coding-agent sessions (2026-10-19).
#
# The adapter's unit tests use hand-built fixtures. This downloads the public
# pi session dataset (huggingface.co/datasets/badlogicgames/pi-mono, ~225 MB,
# 627 sessions) onto the runner and reports how the adapter handles real data.
# The data is never committed to this repository.
#
# Run it: Actions → Pi real sessions → Run workflow (or it runs when this file
# or the script changes).
name: Pi real sessions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pi-real-sessions.yml'
      - 'valichord_attestation/scripts/check_pi_real_sessions.py'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the library and the Hugging Face client
        run: |
          python -m pip install -e valichord_attestation
          python -m pip install huggingface_hub

      - name: Download the public pi session dataset
        run: |
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          p = snapshot_download(repo_id="badlogicgames/pi-mono", repo_type="dataset",
                                local_dir="/tmp/pi-sessions", allow_patterns=["*.jsonl"])
          print("downloaded to", p)
          EOF

      - name: Run the adapter over every session
        working-directory: valichord_attestation
        run: python scripts/check_pi_real_sessions.py /tmp/pi-sessions | tee /tmp/report.txt

      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/report.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
