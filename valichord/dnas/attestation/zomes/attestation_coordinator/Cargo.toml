[package]
name = "attestation_coordinator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hdk = { workspace = true }
serde = { workspace = true }
valichord_shared_types = { path = "../../../../shared_types" }
valichord_coordinator_utils = { workspace = true }
attestation_integrity = { path = "../attestation_integrity" }
getrandom = { workspace = true }
sha2 = { workspace = true }
rmp-serde = { workspace = true }

[features]
# Test-only immutability tripwire externs (see src/lib.rs tail).
# NEVER enable for a production build or a packed production hApp.
test_utils = []
