[package]
name = "governance_coordinator"
version = "0.1.0"
edition = "2021"

[lib]
name = "governance_coordinator"
crate-type = ["cdylib", "rlib"]
# doctest = false so `cargo test` emits ONE result block, not a trailing
# "Doc-tests / running 0 tests" that makes `| tail` report the wrong answer.
# See CLAUDE.md. Neither crate has doc examples; re-enable if that changes.
doctest = false

[dependencies]
hdk = { workspace = true }
serde = { workspace = true }
holochain_serialized_bytes = { workspace = true }
valichord_shared_types = { path = "../../../../shared_types" }
valichord_coordinator_utils = { workspace = true }
governance_integrity = { path = "../governance_integrity" }
getrandom = { workspace = true }

[features]
# Test-only immutability tripwire externs (see src/lib.rs tail).
# NEVER enable for a production build or a packed production hApp.
test_utils = []
